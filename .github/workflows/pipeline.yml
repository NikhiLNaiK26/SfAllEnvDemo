name: Salesforce Validate and Deploy

on:
  push:
    branches:
      - main
      - NikhilDev
      - NikhilQAT
      - NikhilUAT

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: |
          npm install @salesforce/cli --global

      - name: Verify Salesforce CLI
        run: |
          sf --version

      # DEV
      - name: Authenticate DEV Org
        if: github.ref_name == 'NikhilDev'
        run: |
          echo "${{ secrets.NIKHILDEV }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias targetOrg

      # QAT
      - name: Authenticate QAT Org
        if: github.ref_name == 'NikhilQAT'
        run: |
          echo "${{ secrets.NIKHILQAT }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias targetOrg

      # UAT
      - name: Authenticate UAT Org
        if: github.ref_name == 'NikhilUAT'
        run: |
          echo "${{ secrets.NIKHILUAT }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias targetOrg

      # PROD
      - name: Authenticate PROD Org
        if: github.ref_name == 'main'
        run: |
          echo "${{ secrets.NIKHILPROD }}" > authfile
          sf org login sfdx-url --sfdx-url-file authfile --alias targetOrg

      #####################################################
      # VALIDATION
      #####################################################

      - name: Validate Deployment
        run: |
            sf project deploy validate \
            --source-dir force-app \
             --target-org targetOrg \
             --wait 30

      #####################################################
      # DEPLOYMENT
      #####################################################

      - name: Deploy to Target Org
        run: |
            sf project deploy start \
            --source-dir force-app \
            --target-org targetOrg \
            --wait 30
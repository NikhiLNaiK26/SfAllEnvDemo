<template>
   <lightning-card title="Combo Box">
    <lightning-combobox label="Account Name Test"
                      value={value}
                      options={options}
                        placeholder="Select Acocunt Name"
                        onchange={onHandleChange}>
    </lightning-combobox>
    Selected Account : {value}
   </lightning-card>
   
   <template if:true={cardVisible}>
      <lightning-card title="DataTable">
         <lightning-datatable key-field="id"
                              data={data}
                              columns={columns}>
                           </lightning-datatable>
      </lightning-card>
   </template>
</template>
